name: Build APK

on:
  push:
    branches:
      - claude/add-stock-widget-hQSgH
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407

      - name: Install SDK packages
        run: |
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: >
          ./gradlew assembleDebug --no-daemon --stacktrace
          -PversionCode=${{ github.run_number }}
          -PversionName=1.0.${{ github.run_number }}

      - name: Collect release files
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/stock-widget-debug.apk
          echo "${{ github.run_number }}" > dist/latest-version.txt

      - name: Upload as workflow artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: stock-widget-debug-apk
          path: dist/stock-widget-debug.apk
          if-no-files-found: error

      - name: Publish to Releases
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          tag_name: debug-latest
          name: Latest debug build
          body: |
            自動ビルドされた最新のデバッグ APK です。
            スマホでこのページを開き `stock-widget-debug.apk` をタップしてインストールしてください。
            （初回は「提供元不明のアプリ」許可と、Samsung Auto Blocker のオフが必要です）
          files: |
            dist/stock-widget-debug.apk
            dist/latest-version.txt
          prerelease: true
          make_latest: false
