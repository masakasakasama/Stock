name: Build APK

on:
  push:
    branches:
      - claude/add-stock-widget-hQSgH
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: ${{ vars.DATA_MIGRATION_VERIFIED == 'true' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407

      - name: Install SDK packages
        run: |
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build privately signed release APK
        env:
          SIGNING_KEYSTORE_B64: ${{ secrets.STOCK_SIGNING_KEYSTORE_B64 }}
          ANDROID_SIGNING_STORE_PASSWORD: ${{ secrets.STOCK_SIGNING_STORE_PASSWORD }}
          ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.STOCK_SIGNING_KEY_ALIAS }}
          ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.STOCK_SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for v in "$SIGNING_KEYSTORE_B64" "$ANDROID_SIGNING_STORE_PASSWORD" "$ANDROID_SIGNING_KEY_ALIAS" "$ANDROID_SIGNING_KEY_PASSWORD"; do
            test -n "$v" || { echo "::error::Missing private signing secret; refusing to publish APK"; exit 1; }
          done
          export ANDROID_SIGNING_KEYSTORE_PATH="$RUNNER_TEMP/stock-private-signing.jks"
          printf '%s' "$SIGNING_KEYSTORE_B64" | base64 --decode > "$ANDROID_SIGNING_KEYSTORE_PATH"
          chmod 600 "$ANDROID_SIGNING_KEYSTORE_PATH"
          trap 'rm -f "$ANDROID_SIGNING_KEYSTORE_PATH"' EXIT
          ./gradlew assembleRelease --no-daemon --stacktrace \
            -PversionCode=${{ github.run_number }} \
            -PversionName=1.0.${{ github.run_number }}

      - name: Verify APK signer against independently configured certificate
        env:
          EXPECTED_SIGNER: ${{ vars.ANDROID_SIGNING_CERT_SHA256 }}
        run: |
          set -euo pipefail
          test "${#EXPECTED_SIGNER}" -eq 64
          APK=app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose --print-certs "$APK" > signer.txt
          actual=$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' signer.txt | tr 'A-F' 'a-f')
          test "$actual" = "$EXPECTED_SIGNER" || { echo "::error::Unexpected APK signer"; exit 1; }

      - name: Collect release files
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/stock-widget-debug.apk
          (cd dist && sha256sum stock-widget-debug.apk > stock-widget-debug.apk.sha256)
          echo "${{ github.run_number }}" > dist/latest-version.txt

      - name: Upload as workflow artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: stock-widget-debug-apk
          path: |
            dist/stock-widget-debug.apk
            dist/stock-widget-debug.apk.sha256
          if-no-files-found: error

      - name: Publish to Releases
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          tag_name: debug-latest
          name: Latest signed release
          body: |
            新しい秘密鍵で署名・検証された APK です。
            スマホでこのページを開き `stock-widget-debug.apk` をタップしてインストールしてください。
            （初回は「提供元不明のアプリ」許可と、Samsung Auto Blocker のオフが必要です）
          files: |
            dist/stock-widget-debug.apk
            dist/latest-version.txt
            dist/stock-widget-debug.apk.sha256
          prerelease: true
          make_latest: false
